name: e-Patient CI

on:
  push:
    branches: [main, develop, '**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Test environment generator
        run: node --test .github/scripts/write-app-env.test.mjs

      - name: Create CI environment (no real credentials)
        run: node .github/scripts/write-app-env.mjs --ci

      - name: Resolve dependencies and generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: flutter build apk --debug

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: e-patient-ci-debug-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove environment file
        if: always()
        run: rm -f .env
