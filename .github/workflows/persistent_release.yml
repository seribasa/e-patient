name: Kasih Persistent Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New unique release tag (example v2.1.1-dev.1)
        required: true
        type: string
      android_run_id:
        description: Successful Development APK run ID (optional if iOS supplied)
        type: string
      ios_run_id:
        description: Successful Development iOS run ID containing signed IPA (optional if Android supplied)
        type: string
      prerelease:
        description: Mark as prerelease (development backend remains unchanged)
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: persistent-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release helpers
        run: node --test .github/scripts/release-assets.test.mjs
      - name: Validate source builds and unused tag
        id: source
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ANDROID_RUN_ID: ${{ inputs.android_run_id }}
          IOS_RUN_ID: ${{ inputs.ios_run_id }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$/.test(tag)) throw new Error('Invalid tag; use letters, numbers, dot, dash, underscore');
            const builds = [
              [process.env.ANDROID_RUN_ID, '.github/workflows/development_apk.yml'],
              [process.env.IOS_RUN_ID, '.github/workflows/development_ios.yml'],
            ].filter(([id]) => id);
            if (!builds.length) throw new Error('Supply at least one build run ID');
            let sha;
            for (const [id, path] of builds) {
              if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Run IDs must be positive integers');
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: id });
              if (run.status !== 'completed' || run.conclusion !== 'success' || run.event !== 'workflow_dispatch' ||
                  run.path !== path || run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                throw new Error('Only successful manual development builds from this repository are allowed');
              }
              if (sha && sha !== run.head_sha) throw new Error('Android and iOS builds must reference the same commit');
              sha = run.head_sha;
            }
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              throw new Error('Tag already exists; choose a new tag. Existing releases are never overwritten.');
            } catch (error) { if (error.status !== 404) throw error; }
            core.setOutput('sha', sha);
      - name: Download Android build artifacts
        if: inputs.android_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.android_run_id }}
          pattern: e-patient-*-*-${{ inputs.android_run_id }}
          path: release-downloads/android
      - name: Download signed IPA artifacts
        if: inputs.ios_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ios_run_id }}
          pattern: e-patient-*-signed-ipa-${{ inputs.ios_run_id }}
          path: release-downloads/ios
      - name: Select binaries and generate checksums
        run: node .github/scripts/release-assets.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ANDROID_RUN_ID: ${{ inputs.android_run_id }}
          IOS_RUN_ID: ${{ inputs.ios_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
      - name: Publish persistent release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=(--draft)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "Kasih $RELEASE_TAG" --notes-file release-assets/RELEASE-NOTES.md "${flags[@]}"
          shopt -s nullglob
          assets=(release-assets/*.apk release-assets/*.ipa release-assets/SHA256SUMS)
          gh release upload "$RELEASE_TAG" "${assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
