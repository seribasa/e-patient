name: e-Patient Development APK

on:
  workflow_dispatch:
    inputs:
      payment_gateway:
        description: Payment gateway to build
        required: true
        default: midtrans
        type: choice
        options:
          - midtrans
          - stripe
          - both
      build_type:
        description: Android build type
        required: true
        default: both
        type: choice
        options:
          - debug
          - release
          - both
      midtrans_currency:
        description: Midtrans currency supported by your backend
        required: true
        default: IDR
        type: string
      stripe_currency:
        description: Stripe currency supported by your backend
        required: true
        default: IDR
        type: string

permissions:
  contents: read

concurrency:
  group: development-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development-apk:
    name: APK (${{ matrix.gateway }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gateway: ${{ fromJSON(inputs.payment_gateway == 'both' && '["midtrans","stripe"]' || format('["{0}"]', inputs.payment_gateway)) }}
        build_type: ${{ fromJSON(inputs.build_type == 'both' && '["debug","release"]' || format('["{0}"]', inputs.build_type)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Test environment generator
        run: node --test .github/scripts/*.test.mjs
      - name: Prepare placeholder environment
        run: node .github/scripts/write-app-env.mjs --ci
      - name: Resolve dependencies and generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage --reporter expanded
      - name: Create development environment
        run: node .github/scripts/write-app-env.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PAYMENT_URL: ${{ matrix.gateway == 'midtrans' && secrets.PAYMENT_URL_MIDTRANS || matrix.gateway == 'stripe' && secrets.PAYMENT_URL_STRIPE || secrets.PAYMENT_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ matrix.gateway == 'stripe' && secrets.STRIPE_PUBLISHABLE_KEY || '' }}
          PAYMENT_GATEWAY: ${{ matrix.gateway }}
          PAYMENT_CURRENCY: ${{ matrix.gateway == 'midtrans' && inputs.midtrans_currency || inputs.stripe_currency }}
          AUTH_REDIRECT_URL: ${{ vars.AUTH_REDIRECT_URL || 'https://eimunisasi-app.peltops.com/' }}
      - name: Configure stable signing for selected build type
        run: node .github/scripts/configure-signing.mjs
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          DEBUG_KEYSTORE_BASE64: ${{ matrix.build_type == 'debug' && secrets.DEBUG_KEYSTORE_BASE64 || '' }}
          DEBUG_KEY_ALIAS: ${{ matrix.build_type == 'debug' && secrets.DEBUG_KEY_ALIAS || '' }}
          DEBUG_KEY_PASSWORD: ${{ matrix.build_type == 'debug' && secrets.DEBUG_KEY_PASSWORD || '' }}
          DEBUG_KEYSTORE_PASSWORD: ${{ matrix.build_type == 'debug' && secrets.DEBUG_KEYSTORE_PASSWORD || '' }}
          RELEASE_KEYSTORE_BASE64: ${{ matrix.build_type == 'release' && secrets.RELEASE_KEYSTORE_BASE64 || '' }}
          RELEASE_KEY_ALIAS: ${{ matrix.build_type == 'release' && secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ matrix.build_type == 'release' && secrets.RELEASE_KEY_PASSWORD || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ matrix.build_type == 'release' && secrets.RELEASE_KEYSTORE_PASSWORD || '' }}
      - name: Build development APK
        run: flutter build apk "--${BUILD_TYPE}"
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
      - name: Name gateway APK
        run: cp "build/app/outputs/flutter-apk/app-${BUILD_TYPE}.apk" "build/app/outputs/flutter-apk/app-${PAYMENT_GATEWAY}-${BUILD_TYPE}.apk"
        env:
          PAYMENT_GATEWAY: ${{ matrix.gateway }}
          BUILD_TYPE: ${{ matrix.build_type }}
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: e-patient-${{ matrix.gateway }}-${{ matrix.build_type }}-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.gateway }}-${{ matrix.build_type }}.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload public App Link association
        uses: actions/upload-artifact@v4
        with:
          name: e-patient-app-links-${{ matrix.gateway }}-${{ matrix.build_type }}-${{ github.run_id }}
          path: build/app-links/assetlinks-${{ matrix.build_type }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove environment and signing files
        if: always()
        run: rm -f .env android/key.properties android/keystore/debug.jks android/keystore/release.jks
